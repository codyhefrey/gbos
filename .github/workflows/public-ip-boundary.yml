name: Public IP and credential boundary
on:
  pull_request:
  push:
    branches: [main, build/retail-contract-v1]
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public file and credential boundary
        run: python scripts/public_boundary_check.py
